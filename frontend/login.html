<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医院门诊挂号缴费系统 - 登录</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div id="app">
        <div class="login-container">
            <div class="login-left">
                <div class="hospital-logo">
                    <i class="el-icon-office-building"></i>
                </div>
                <h1 class="hospital-title">医院门诊挂号缴费系统</h1>
                <p class="hospital-subtitle">Hospital Outpatient Registration & Payment System</p>
                <div class="login-features">
                    <div class="feature-item">
                        <i class="el-icon-date"></i>
                        <span>在线预约挂号</span>
                    </div>
                    <div class="feature-item">
                        <i class="el-icon-money"></i>
                        <span>便捷缴费支付</span>
                    </div>
                    <div class="feature-item">
                        <i class="el-icon-user"></i>
                        <span>医生工作台</span>
                    </div>
                    <div class="feature-item">
                        <i class="el-icon-s-data"></i>
                        <span>数据统计管理</span>
                    </div>
                </div>
            </div>
            <div class="login-right">
                <div class="login-form-wrapper">
                    <h2 class="login-title">用户登录</h2>
                    <el-form :model="loginForm" :rules="loginRules" ref="loginForm" class="login-form">
                        <el-form-item prop="username">
                            <el-input v-model="loginForm.username" prefix-icon="el-icon-user" placeholder="请输入用户名" size="large"></el-input>
                        </el-form-item>
                        <el-form-item prop="password">
                            <el-input v-model="loginForm.password" prefix-icon="el-icon-lock" type="password" placeholder="请输入密码" size="large" @keyup.enter.native="handleLogin"></el-input>
                        </el-form-item>
                        <el-form-item prop="role">
                            <el-radio-group v-model="loginForm.role" class="role-selector">
                                <el-radio-button label="patient">患者</el-radio-button>
                                <el-radio-button label="doctor">医生</el-radio-button>
                                <el-radio-button label="cashier">收费员</el-radio-button>
                                <el-radio-button label="admin">管理员</el-radio-button>
                            </el-radio-group>
                        </el-form-item>
                        <el-form-item>
                            <el-button type="primary" size="large" class="login-btn" :loading="loading" @click="handleLogin">登 录</el-button>
                        </el-form-item>
                    </el-form>
                    <div class="test-accounts">
                        <p class="test-title">测试账号（密码均为 123456）</p>
                        <div class="account-list">
                            <span @click="fillAccount('admin')">admin</span>
                            <span @click="fillAccount('doctor1')">doctor1</span>
                            <span @click="fillAccount('doctor2')">doctor2</span>
                            <span @click="fillAccount('cashier')">cashier</span>
                            <span @click="fillAccount('patient1')">patient1</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@2.6.14/dist/vue.js"></script>
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    loginForm: {
                        username: '',
                        password: '',
                        role: 'patient'
                    },
                    loginRules: {
                        username: [{ required: true, message: '请输入用户名', trigger: 'blur' }],
                        password: [{ required: true, message: '请输入密码', trigger: 'blur' }]
                    },
                    loading: false
                }
            },
            methods: {
                handleLogin() {
                    this.$refs.loginForm.validate((valid) => {
                        if (valid) {
                            this.loading = true;
                            api.login(this.loginForm.username, this.loginForm.password).then(res => {
                                if (res.code === 200) {
                                    localStorage.setItem('token', res.data.token);
                                    localStorage.setItem('userInfo', JSON.stringify(res.data));
                                    this.$message.success('登录成功');
                                    setTimeout(() => {
                                        window.location.href = 'index.html';
                                    }, 500);
                                } else {
                                    this.$message.error(res.message || '登录失败');
                                }
                            }).catch(() => {
                                this.$message.error('登录失败，请检查网络连接');
                            }).finally(() => {
                                this.loading = false;
                            });
                        }
                    });
                },
                fillAccount(username) {
                    this.loginForm.username = username;
                    this.loginForm.password = '123456';
                    const roleMap = {
                        'admin': 'admin',
                        'doctor1': 'doctor',
                        'doctor2': 'doctor',
                        'cashier': 'cashier',
                        'patient1': 'patient'
                    };
                    this.loginForm.role = roleMap[username] || 'patient';
                }
            }
        });
    </script>
</body>
</html>
