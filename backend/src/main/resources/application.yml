server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: hospital-registration-system
  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hospital_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    # 数据库密码通过环境变量注入；本地默认回退到示例密码，正式环境请通过 MYSQL_PASSWORD 环境变量指定
    password: ${MYSQL_PASSWORD:123456}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  # Redis配置
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0
  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hospital.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: hospital-registration-system-secret-key-2024
  expiration: 7200000  # 2小时
  header: Authorization
  prefix: Bearer

# 系统配置
system:
  # 预约提前天数
  advance-days: 7
  # 退号时限（小时）
  cancel-hours: 2
  # 号源缓存前缀
  cache-prefix: "hospital:schedule:"

# Knife4j配置
knife4j:
  enable: true
  openapi:
    title: 医院门诊挂号缴费系统API文档
    description: 医院门诊挂号缴费系统接口文档
    version: 1.0.0
    concat: admin@hospital.com

# 日志配置
logging:
  level:
    com.hospital: debug
    com.hospital.mapper: debug
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
